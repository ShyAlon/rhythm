name: dispatch-reminders

# Every 5 minutes, ping the Supabase edge function that sends due push reminders.
# Doubles as a keep-alive so the free-tier Supabase project never goes idle-paused.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call dispatcher
        run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_FUNCTION_URL }}" \
            -H "x-dispatch-secret: ${{ secrets.DISPATCH_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}'
